schema: spec-driven

context: |
  Nah? is a private social network: one circle of up to 150 people
  per person. Every change keeps the product-principles spec.
  Reasons live in docs/decisions; the wiki starts at
  docs/wiki/quickstart.md.
  Every change is named cdi-<number>-<slug> after its one Linear
  issue in the Nah? project, as CLAUDE.md sets out.

rules:
  proposal:
    - >-
      Name the change cdi-<number>-<slug>, lowercase, matching its
      Linear issue's git branch. Create or find the issue first.
    - >-
      Under the title, link the issue as
      "Linear: [CDI-<number>](https://linear.app/cdit/issue/CDI-<number>)".
